site_name: JapanFold API
site_description: JapanFold API documentation. Free, public, Tenstorrent-accelerated protein structure prediction, binder design and protein embeddings.
site_url: https://docs.japanfold.aiand.com/
repo_url: https://github.com/japanfold/japanfold
repo_name: japanfold/japanfold
edit_uri: edit/master/docs/
copyright: JapanFold. 100% Japan-hosted, powered by ai&amp; on Tenstorrent.

nav:
  - Start here:
      - Overview: index.md
      - Authentication: authentication.md
      - Examples: examples.md
  - Endpoints:
      - Predictions: predictions.md
      - Designs: designs.md
      - Embeddings: embeddings.md
      - Jobs: jobs.md
      - Errors: errors.md
  - Reference:
      - Models & limits: models-and-limits.md
      - Accuracy: accuracy.md
      - The JapanFold skill: skill.md
      - API reference: api.html

theme:
  name: material
  logo: assets/japanfold-mark.svg
  favicon: assets/favicon.png
  # Same type system as the app: DM Sans for prose and UI, Fragment Mono for
  # anything you would paste into a terminal.
  font:
    text: DM Sans
    code: Fragment Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.suggest
    - search.highlight
    - search.share

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

extra_css:
  - stylesheets/japanfold.css

extra:
  generator: false
  social:
    - icon: fontawesome/solid/flask
      link: https://japanfold.aiand.com
      name: japanfold.aiand.com
    - icon: fontawesome/brands/github
      link: https://github.com/japanfold/japanfold
      name: GitHub
